name: Build and Publish

on:
  push:
    branches:
      - main
      - develop
      - final
    tags:
      - v*
  pull_request:
    branches:
      - main
      - develop

jobs:
  # Sanitize Job - always runs on every push and PR
  sanitize:
    name: Sanitize
    uses: ./.github/workflows/sanitize.yml

  # NPM Release Job - only runs on tag push
  release:
    name: Publish
    if: startsWith(github.ref, 'refs/tags/v')
    needs: sanitize
    uses: ./.github/workflows/publish.yml

  # Create Release Notes Job - only runs on tag push
  release-notes:
    name: Release Notes
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release
    uses: ./.github/workflows/release-notes.yml
