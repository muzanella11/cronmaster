name: Publish to NPM

on: workflow_call

permissions:
  id-token: write # Required for OIDC
  contents: read

jobs:
  # Build Job
  build:
    name: Build distribution
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      # Step 1: Checkout repository
      - name: Checkout code
        uses: actions/checkout@v3

      # Step 2: Set up Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20
          cache: "yarn"

      # Step 3: Install dependencies
      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # Step 4: Lint and Format Check
      - name: Lint and Format Check
        run: yarn lint && yarn format:check

      # Step 5: Build the Project
      - name: Build the project
        run: yarn build

      # Step 6: Verify build output
      - name: Verify build output
        run: |
          if [ ! -d "dist" ]; then
            echo "Build output directory 'dist' does not exist."
            exit 1
          fi
          echo "Build output directory 'dist' exists."

      # Step 7: Publish to NPM
      - name: Publish to NPM
        run: |
          echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}" > ~/.npmrc
          npm publish --access public --non-interactive --no-git-tag-version --new-version ${GITHUB_REF#refs/tags/v}
        env:
          GITHUB_REF: ${{ github.ref }}
